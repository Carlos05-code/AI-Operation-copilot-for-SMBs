# Grafana Loki — single-binary, local disk storage. Local/dev only; a real
# deployment would point object_store at S3/GCS/Azure instead of filesystem.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Keep a week of local-dev logs; tune (or point at real retention tooling)
  # before this config is ever reused anywhere logs need to live longer.
  retention_period: 168h
