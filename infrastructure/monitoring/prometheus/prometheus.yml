global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerting-rules.yml

scrape_configs:
  # The API runs on the host (`pnpm start`/`start:dev`), not in this compose
  # file — `host.docker.internal` is Docker Desktop's route back to it.
  # Point this at the real container/Service name once the API is
  # containerized (ROADMAP Phase 5 — Kubernetes deployment).
  - job_name: 'backend-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
