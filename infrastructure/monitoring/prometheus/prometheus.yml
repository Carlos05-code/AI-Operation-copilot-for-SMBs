global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
  - job_name: 'backend-workers'
    static_configs:
      - targets: ['worker:9464']
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
