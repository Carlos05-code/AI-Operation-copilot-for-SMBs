# OTel Collector — receives what the app pushes (traces today; metrics stay
# on Prometheus's pull model, scraped straight from GET /metrics, so there's
# no metrics pipeline here) and forwards to Tempo. See DEVOPS_SPEC §8.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
