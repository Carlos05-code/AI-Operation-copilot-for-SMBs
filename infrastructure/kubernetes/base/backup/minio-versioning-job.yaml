# One-time (idempotent) setup: MinIO bucket versioning (DEVOPS_SPEC §9: "bucket replication /
# version history", RPO 15m continuous) — MinIO's own object versioning gives a rolling history
# of every object automatically, no scheduled job needed for the mechanism itself, just this one
# `mc version enable` per bucket. Apply once per cluster (`kubectl apply -f
# minio-versioning-job.yaml`); a later re-run is a harmless no-op since enabling versioning on an
# already-versioned bucket doesn't change anything.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-versioning-setup
  namespace: smb-copilot
spec:
  backoffLimit: 2
  template:
    # `quay.io/minio/mc` runs as root by default (verified against its published image config).
    # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
    spec:
      restartPolicy: Never
      containers:
        - name: enable-versioning
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          command:
            - sh
            - -c
            - |
              mc alias set backupstore "$STORAGE_ENDPOINT" "$STORAGE_ACCESS_KEY" "$STORAGE_SECRET_KEY"
              mc mb --ignore-existing "backupstore/$STORAGE_BUCKET"
              mc mb --ignore-existing "backupstore/$STORAGE_BACKUP_BUCKET"
              mc version enable "backupstore/$STORAGE_BUCKET"
              mc version enable "backupstore/$STORAGE_BACKUP_BUCKET"
          env:
            - name: STORAGE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: STORAGE_ENDPOINT
            - name: STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: STORAGE_BUCKET
            - name: STORAGE_BACKUP_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: STORAGE_BACKUP_BUCKET
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: STORAGE_ACCESS_KEY
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: STORAGE_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
