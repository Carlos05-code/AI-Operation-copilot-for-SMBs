# The "second bootstrap file with no HTTP listener" api-deployment.yaml's own header comment
# named as the gap — apps/backend/src/main-worker.ts, same image, only the container `command`
# differs. Runs the identical `AppModule` `api`'s Deployment does, so every `@Processor` this app
# has is registered here too; BullMQ consumers on the same queue name are exactly how you scale
# worker capacity (Redis-backed per-job locking makes concurrent consumers safe by design), so
# this is *additional*, independently scalable capacity alongside the `api` Deployment's
# in-process processing, not a replacement for it.
#
# No REST API and no Ingress here on purpose — see main-worker.ts's own header comment for why a
# real split (giving every feature module its own HTTP-only and worker-only half) is a materially
# larger change than this deployment split, not done here. `/metrics` and `/healthz` still need a
# real listener (a bare `node:http` server, not Nest's HTTP adapter) since Prometheus has to
# scrape this process's queue-depth gauge too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: smb-copilot
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: smb-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: smb-copilot
    spec:
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/carlos05-code/ai-operation-copilot-for-smbs/backend:v0.0.0-placeholder
          imagePullPolicy: IfNotPresent
          command: ['node', '-r', './dist/shared/telemetry/preload.js', 'dist/main-worker.js']
          ports:
            - name: metrics
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      terminationGracePeriodSeconds: 30
