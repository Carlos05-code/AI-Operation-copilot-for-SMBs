# TEMPLATE — every value below is a placeholder, not a real credential.
# This file documents which keys the API needs at the `Secret` layer; it is
# not applied as-is. In staging/production, generate the real Secret out of
# band (SealedSecrets, External Secrets Operator, or a manual `kubectl create
# secret generic api-secret --from-literal=...`) and never commit it.
#
# Rename to `api-secret.yaml`, fill in real values, and it is picked up by
# name from `api-deployment.yaml`'s `envFrom` — but doing that in this repo
# would commit a plaintext secret, so it is deliberately named `.example`
# and excluded from the base `kustomization.yaml`'s resources list.
#
# This one Secret is also reused as the credential source for the
# StatefulSets in ../infrastructure/ and for Keycloak (same pattern
# docker-compose already uses: Keycloak's `KC_DB_PASSWORD` reads the same
# password Postgres itself is initialized with) — one source of truth
# instead of duplicating each password across several Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: smb-copilot
type: Opaque
stringData:
  POSTGRES_PASSWORD: '__CHANGE_ME__'
  DATABASE_URL: 'postgresql://admin:__CHANGE_ME__@postgres:5432/smb_copilot'

  REDIS_PASSWORD: ''

  RABBITMQ_USER: 'ops'
  RABBITMQ_PASSWORD: '__CHANGE_ME__'
  RABBITMQ_URL: 'amqp://ops:__CHANGE_ME__@rabbitmq:5672'
  RABBITMQ_VHOST: '/'

  NEO4J_PASSWORD: '__CHANGE_ME__'
  NEO4J_AUTH: 'neo4j/__CHANGE_ME__'

  QDRANT_API_KEY: ''

  OPENSEARCH_PASSWORD: '__CHANGE_ME__'

  STORAGE_ACCESS_KEY: '__CHANGE_ME__'
  STORAGE_SECRET_KEY: '__CHANGE_ME__'

  KEYCLOAK_ADMIN_PASSWORD: '__CHANGE_ME__'
  KEYCLOAK_CLIENT_SECRET: '__CHANGE_ME__'

  JWT_ACCESS_TOKEN_SECRET: '__CHANGE_ME__'
  JWT_REFRESH_TOKEN_SECRET: '__CHANGE_ME__'
  JWT_ACCESS_TOKEN_TTL: '15m'
  JWT_REFRESH_TOKEN_TTL: '7d'

  EMBEDDINGS_API_KEY: ''

  LLM_API_KEY: ''

  SMTP_PASSWORD: ''
