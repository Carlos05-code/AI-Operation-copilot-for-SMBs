# Single Deployment serving HTTP and processing BullMQ jobs in-process —
# there is no separate worker entrypoint yet (all `@Processor`s register on
# the same Nest app `main.ts` boots; see apps/backend/src/main.ts). Scaling
# this Deployment scales both. A true API/worker split (a second bootstrap
# with no HTTP listener, its own `worker-deployment.yaml`) is deferred —
# tracked as a documented gap, same convention as the WhatsApp and Loki
# gaps in ROADMAP.md.
#
# Image: `ghcr.io/carlos05-code/ai-operation-copilot-for-smbs/backend`, the exact path
# `.github/workflows/release.yml` pushes to on a `v*` tag (GHCR requires an all-lowercase
# path, unlike the mixed-case GitHub repo name). `v0.0.0-placeholder` below is not a real
# published tag — the staging/production overlays override it via their `images:` transformer,
# but release.yml only ever pushes the exact `${GITHUB_REF_NAME}` version tag, not a floating
# `:staging`/`:production` tag; wiring up that promotion step is still a gap, not done here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: smb-copilot
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: smb-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: smb-copilot
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/carlos05-code/ai-operation-copilot-for-smbs/backend:v0.0.0-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      terminationGracePeriodSeconds: 30
