apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: smb-copilot
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
    - name: grpc
      port: 6334
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: smb-copilot
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
    spec:
      # `v1.9` (the tag docker-compose.yml used) no longer exists on Docker Hub (verified:
      # only `v1.9.0`..`v1.9.7`, each with a paired `-unprivileged` variant, are published now).
      # The `-unprivileged` variant runs as uid 1000 by default (verified against its published
      # image config); the plain tag runs as root (`0:0`) — picking the former makes
      # `runAsNonRoot: true` below actually true, not just asserted.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.9.7-unprivileged
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
