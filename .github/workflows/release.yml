name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build, migrate & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        working-directory: infrastructure/docker
        run: |
          docker build -f Dockerfile.api -t ${{ env.IMAGE_BASE }}/backend:${{ github.ref_name }} ..
          docker push ${{ env.IMAGE_BASE }}/backend:${{ github.ref_name }}

      - name: Release notes from CHANGELOG
        id: notes
        run: |
          NOTES=$(sed -n "/## \[${GITHUB_REF_NAME##*/}\]/,/^## /p" CHANGELOG.md)
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" CHANGELOG.md
