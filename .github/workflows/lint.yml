name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder

      - name: Turborepo task lint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint (root config)
        run: npx eslint "**/*.{ts,tsx,js}" --max-warnings 0

      # Activates once the Flutter app is scaffolded (apps/mobile/pubspec.yaml).
      - name: Flutter analyze
        if: ${{ hashFiles('apps/mobile/pubspec.yaml') != '' }}
        working-directory: apps/mobile
        run: flutter analyze
