name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turborepo task lint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint (root config)
        run: npx eslint "**/*.{ts,tsx,js}" --max-warnings 0

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze