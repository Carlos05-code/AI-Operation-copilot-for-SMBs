# AI Operations Copilot for SMBs — local development stack
# Full production topology is defined in infrastructure/kubernetes.

name: smb-copilot

# Debian ("bookworm"), not Alpine — matches
# infrastructure/kubernetes/base/infrastructure/postgres.yaml, which needs a glibc base for
# wal-g (no musl/Alpine build exists). Local dev doesn't run wal-g at all (no WAL archiving
# here, just the plain database), but keeping the same base image avoids two different
# behaviors for what's meant to be "the same Postgres" across environments.
x-postgres: &postgres
  image: postgres:16.15-bookworm

services:
  postgres:
    <<: *postgres
    container_name: smb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smb_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smb-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smb-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-changeme}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: smb-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10

  qdrant:
    # `v1.9` no longer exists on Docker Hub (verified: only `v1.9.0`..`v1.9.7` are published,
    # discovered while wiring up infrastructure/kubernetes/base/infrastructure/qdrant.yaml).
    # `-unprivileged` runs as a non-root uid by default.
    image: qdrant/qdrant:v1.9.7-unprivileged
    container_name: smb-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrantdata:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: smb-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-changeme}
      bootstrap.memory_lock: 'false'
      DISABLE_SECURITY_PLUGIN: 'true'
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  minio:
    # `minio/minio` no longer exists on Docker Hub — MinIO moved their images to Quay
    # (verified: the Docker Hub repo now 404s), discovered while wiring up
    # infrastructure/kubernetes/base/infrastructure/minio.yaml.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: smb-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-ops}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-changeme}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: smb-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/smb_copilot
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KC_HTTP_PORT: 8080
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloakdata:/opt/keycloak/data
      # Realm import lives under kubernetes/base so kustomize's configMapGenerator
      # (infrastructure/kubernetes/base/keycloak/kustomization.yaml) can reference
      # it without reaching outside its own directory (a hard sandbox restriction).
      - ./infrastructure/kubernetes/base/keycloak:/opt/keycloak/data/import:ro

  # --- `monitoring` profile (DEVOPS_SPEC §8) -------------------------------
  # `docker compose --profile monitoring up` — traces, metrics, and logs. Port
  # 3100 is published to the host because the API itself runs on the host in
  # local dev (not in this compose file), and ships its own logs straight to
  # Loki over HTTP (`LOKI_URL=http://localhost:3100` in `.env`) rather than
  # through a container-log-tailing agent, which couldn't see a host process's
  # stdout anyway. See infrastructure/monitoring/README.md.

  loki:
    image: grafana/loki:3.6.16
    container_name: smb-loki
    profiles: [monitoring]
    command: ['-config.file=/etc/loki/loki-config.yaml']
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    ports:
      - '3100:3100'

  otel-collector:
    image: otel/opentelemetry-collector:0.160.0
    container_name: smb-otel-collector
    profiles: [monitoring]
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./infrastructure/monitoring/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:3.0.3
    container_name: smb-tempo
    profiles: [monitoring]
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infrastructure/monitoring/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - '3200:3200' # Tempo API (Grafana datasource)

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: smb-prometheus
    profiles: [monitoring]
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:13.2.1
    container_name: smb-grafana
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '3300:3000'
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  neo4jdata:
  qdrantdata:
  opensearchdata:
  miniodata:
  keycloakdata:
  tempodata:
  prometheusdata:
  grafanadata:
  lokidata:
