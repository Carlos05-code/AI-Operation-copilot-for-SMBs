# AI Operations Copilot for SMBs — local development stack
# Full production topology is defined in infrastructure/kubernetes.

name: smb-copilot

x-postgres: &postgres
  image: postgres:16-alpine

services:
  postgres:
    <<: *postgres
    container_name: smb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smb_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smb-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smb-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-changeme}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: smb-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9
    container_name: smb-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrantdata:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: smb-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-changeme}
      bootstrap.memory_lock: 'false'
      DISABLE_SECURITY_PLUGIN: 'true'
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  minio:
    image: minio/minio:latest
    container_name: smb-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-ops}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-changeme}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: smb-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/smb_copilot
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KC_HTTP_PORT: 8080
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloakdata:/opt/keycloak/data
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  neo4jdata:
  qdrantdata:
  opensearchdata:
  miniodata:
  keycloakdata:
