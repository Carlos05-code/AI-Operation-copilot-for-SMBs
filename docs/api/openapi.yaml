openapi: 3.1.0
info:
  title: AI Operations Copilot API
  version: 0.1.0-alpha
  description: >
    Public REST API for the AI Operations Copilot platform. This document is a
    placeholder for the generated OpenAPI 3.1 contract that is auto-published
    from the NestJS API (`apps/backend`) on every release.
servers:
  - url: /api/v1
    description: Default edge path prefix
security:
  - bearerAuth: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [code, message, status, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        details:
          type: object
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
